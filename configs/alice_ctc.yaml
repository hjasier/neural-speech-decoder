  raiz: data/alice_eeg
  catalogo: docs/datasets/alice_eeg/catalogo_ctc.json
  sujeto: sub-001
  sesiones:
  - sub-001
  preparados: data/alice_eeg/preparados_ctc
  train_segmentos:
  - 1
  - 2
  - 3
  - 4
  - 5
  - 6
  - 7
  - 8
