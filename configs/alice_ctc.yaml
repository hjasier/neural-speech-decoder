preprocesamiento:
  banda_hz:
  - 0.5
  - 20.0
  orden_filtro: 4
  frecuencia_salida: 64
  margen_segmento_s: 2.0
  normalizacion_epsilon: 1.0e-06
  clip_z: 8.0
modelo:
  nombre: speech_gru
  entrada: 60
  capa_dia: 60
  capas: 2
  unidades: 128
  bidireccional: false
  kernel: 8
  stride: 2
  dropout_entrada: 0.2
  dropout_gru: 0.2
entrenamiento:
  pasos: 1000
  max_segundos: 180
  micro_batch_size: 8
  optimizador: adam_tensorflow
  betas:
  - 0.9
  - 0.999
  epsilon: 0.1
  learning_rate:
    inicio: 0.02
    final: 0.0
    decay_pasos: 1000
    potencia: 1.0
  clip_grad_norm: 10.0
  l2: 1.0e-05
  ruido:
    blanco_sd: 0.0
    offset_sd: 0.0
  imprimir_cada: 25
evaluacion:
  micro_batch_size: 8
  cada_pasos: 50
  max_lotes: null
ejecucion:
  dispositivo: cpu
  hilos_cpu: 2
