experimento:
  nombre: exploracion_adicional_t12
  seed: 42

wandb:
  proyecto: tiiac-2026
  modo: offline

salida: runs/exploracion_adicional
bin_segundos: 0.02
controles: [DO_NOTHING, DO NOTHING, Do Nothing]

tareas:
  fonemas_21:
    archivo: data/speech_2023/tuningTasks/t12.2022.04.21_phonemes.mat
    nombre: Fonemas del 21
  fonemas_26:
    archivo: data/speech_2023/tuningTasks/t12.2022.04.26_phonemes.mat
    nombre: Fonemas del 26
  palabras:
    archivo: data/speech_2023/tuningTasks/t12.2022.05.03_fiftyWordSet.mat
    nombre: 50 palabras
  movimientos:
    archivo: data/speech_2023/tuningTasks/t12.2022.04.21_orofacial.mat
    nombre: Movimientos de la cara

areas:
  6v: [0, 128]
  '44': [128, 256]
  todos: [0, 256]

rasgos:
  tx_media: {senales: [tx1], area: 6v, ventanas: 1, periodo: go}
  potencia_media: {senales: [spikePow], area: 6v, ventanas: 1, periodo: go}
  ambas_media: {senales: [tx1, spikePow], area: 6v, ventanas: 1, periodo: go}
  ambas_3_ventanas: {senales: [tx1, spikePow], area: 6v, ventanas: 3, periodo: go}
  ambas_44: {senales: [tx1, spikePow], area: '44', ventanas: 1, periodo: go}
  ambas_todos: {senales: [tx1, spikePow], area: todos, ventanas: 1, periodo: go}
  ambas_espera: {senales: [tx1, spikePow], area: 6v, ventanas: 1, periodo: delay}

normalizacion:
  escala_si_cero: 1.0

modelos:
  centroides: {tipo: centroides}
  lda: {tipo: lda, regularizacion: 0.3}

comparaciones:
  fonemas:
    - [fonemas_21, tx_media, centroides]
    - [fonemas_26, tx_media, centroides]
    - [fonemas_21, ambas_media, lda]
    - [fonemas_26, ambas_media, lda]
  senales:
    - [fonemas_26, tx_media, centroides]
    - [fonemas_26, potencia_media, centroides]
    - [fonemas_26, ambas_media, centroides]
    - [fonemas_26, tx_media, lda]
    - [fonemas_26, potencia_media, lda]
    - [fonemas_26, ambas_media, lda]
  areas:
    - [fonemas_26, ambas_media, lda]
    - [fonemas_26, ambas_44, lda]
    - [fonemas_26, ambas_todos, lda]
  palabras:
    - [palabras, tx_media, centroides]
    - [palabras, tx_media, lda]
    - [palabras, ambas_media, lda]
  ventanas:
    - [fonemas_26, ambas_media, lda]
    - [fonemas_26, ambas_3_ventanas, lda]
    - [palabras, ambas_media, lda]
    - [palabras, ambas_3_ventanas, lda]
  espera:
    - [fonemas_26, ambas_media, lda]
    - [fonemas_26, ambas_espera, lda]
  movimientos:
    - [movimientos, ambas_media, lda]

otro_dia:
  direcciones: [[fonemas_21, fonemas_26], [fonemas_26, fonemas_21]]
  rasgos: ambas_media
  modelo: lda

etiquetas_mezcladas:
  tareas: [fonemas_26, palabras]
  rasgos: ambas_3_ventanas
  modelo: lda
  repeticiones: 20

frases:
  carpeta: data/speech_2023/competitionData/train
  patron_palabras: "[a-z]+(?:'[a-z]+)?"

grafico:
  tareas: [fonemas_26, palabras]
  titulos: ['39 fonemas del día 26', '50 palabras del día 3']
  rasgos: [tx_media, ambas_media, ambas_3_ventanas]
  etiquetas: [Solo tx1, tx1 + potencia, tx1 + potencia en 3 ventanas]
  modelo: lda
  tamano: [11, 4]
  colores: ['#2374ab', '#42a58d', '#e87a32']
  dpi: 140
  archivo: comparacion_ventanas.png
