# Línea A: T5 preentrenado que traduce los fonemas predichos por la GRU a texto.
# Se entrena con scripts/train_text_decoder.py sobre los pares de train por
# ajuste cruzado y se selecciona por WER de val, como la GRU por PER de val.
# Test no se toca: queda para la Fase 5.
experimento:
  nombre: lineaA_t5
  seed: 0
datos:
  # Salida de scripts/export_phoneme_pairs.py; se comprueban los hashes de su manifiesto.
  pares: data/lineaA/pares_ajuste_cruzado_v1
  prefijo: "fonemas a texto: "
  # Se rechaza una frase que no quepa: truncarla cambiaría su WER sin avisar.
  max_tokens_entrada: 320
  max_tokens_salida: 96
modelo:
  nombre: t5_texto
  base: google/flan-t5-base
  # Rama del repositorio; resultado.json guarda el commit que se descargó.
  revision: main
entrenamiento:
  pasos: 4000
  batch_size: 32
  learning_rate: 3.0e-4
  # Subida lineal hasta learning_rate y bajada lineal hasta cero al final.
  calentamiento_pasos: 200
  weight_decay: 0.01
  clip_grad_norm: 1.0
  imprimir_cada: 50
evaluacion:
  cada_pasos: 250
  batch_size: 128
  # La selección usa búsqueda voraz; la evaluación final del elegido, haz.
  num_beams_seleccion: 1
  num_beams_final: 4
bootstrap:
  remuestreos: 10000
  confianza: 0.95
  semilla: 20261127
ejecucion:
  dispositivo: cuda
  hilos_cpu: 2
  # bfloat16 en GPU; en CPU se ignora.
  bf16: true
salida:
  directorio: checkpoints/lineaA/t5
  tabla: docs/resultados/lineaA_t5
wandb:
  proyecto: tiiac-2026
  entidad: null
  modo: online
  directorio: runs/tracking
