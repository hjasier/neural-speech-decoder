preprocesamiento:
  normalizacion_epsilon: 1.0e-08
  normalizacion:
    modo: rodante
    frases_mezcla: 10
    ventana_frases: 20
    # Suelo propio de la desviación rodante, relativo a la de train del día.
    desviacion_minima_relativa: 0.1
  suavizado:
    sigma: 2.0
    umbral: 0.01
    longitud_impulso: 100
    truncate: 4.0
modelo:
  nombre: speech_gru
  entrada: 256
  capa_dia: 256
  capas: 5
  unidades: 1024
  bidireccional: false
  kernel: 32
  stride: 4
  dropout_entrada: 0.2
  dropout_gru: 0.4
entrenamiento:
  pasos: 10001
  micro_batch_size: 64
  optimizador: adam_tensorflow
  betas:
  - 0.9
  - 0.999
  epsilon: 0.1
  learning_rate:
    inicio: 0.02
    final: 0.0
    decay_pasos: 10000
    potencia: 1.0
  clip_grad_norm: 10.0
  l2: 1.0e-05
  ruido:
    blanco_sd: 1.0
    offset_sd: 0.2
  imprimir_cada: 10
evaluacion:
  micro_batch_size: 64
  cada_pasos: 50
  max_lotes: null
ejecucion:
  dispositivo: cuda
  hilos_cpu: 2
salida:
  directorio: checkpoints/final/t12_offline
wandb:
