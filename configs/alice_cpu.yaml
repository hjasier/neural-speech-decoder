# Experimento propio: potencia acústica por palabra desde EEG de escucha.
# No predice texto ni habla intentada. Perfil CPU pequeño y reproducible.
tarea: alice_power
experimento:
  nombre: alice_power_sub001_cpu
  seed: 0
datos:
  raiz: data/alice_eeg
  catalogo: docs/datasets/alice_eeg/catalogo.json
  sujeto: sub-001
  train_segmentos: [1, 2, 3, 4, 5, 6, 7, 8]
  val_segmentos: [9, 10]
  test_segmentos: [11, 12]
  objetivo: sound_power
preprocesamiento:
  banda_hz: [0.5, 20.0]
  orden_filtro: 4
  frecuencia_salida: 64
  baseline_s: [-0.2, 0.0]
  ventana_s: [0.1, 0.6]
  margen_segmento_s: 2.0
  epsilon: 0.000001
  clip_z: 8.0
modelo:
  nombre: alice_gru
  entrada: 60
  proyeccion: 32
  unidades: 32
  capas: 2
  dropout: 0.1
ridge:
  bins_temporales: 4
  alphas: [0.1, 1.0, 10.0, 100.0, 1000.0, 10000.0]
entrenamiento:
  batch_size: 64
  epocas: 30
  paciencia: 6
  max_segundos: 120
  learning_rate: 0.001
  weight_decay: 0.001
  clip_grad_norm: 1.0
evaluacion:
  desplazamientos: 199
  minimo_desplazamiento_palabras: 20
ejecucion:
  dispositivo: cpu
  hilos_cpu: 2
salida:
  directorio: runs/alice_power
wandb:
  proyecto: tiiac-2026
  entidad: null
  modo: offline
  directorio: runs/tracking
