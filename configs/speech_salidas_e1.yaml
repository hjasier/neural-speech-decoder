  pasos: 200
  micro_batch_size: 16
  optimizador: adam_tensorflow
  betas:
  - 0.9
  - 0.999
  epsilon: 0.1
  learning_rate:
    inicio: 0.02
    final: 0.0
    decay_pasos: 10000
    potencia: 1.0
  clip_grad_norm: 10.0
  l2: 1.0e-05
  ruido:
    blanco_sd: 1.0
    offset_sd: 0.2
  imprimir_cada: 10
  ctc_pesos:
    '2': 0.25
    '3': 0.25
    '5': 0.5
evaluacion:
