    umbral: 0.01
    longitud_impulso: 100
    truncate: 4.0
modelo:
  nombre: speech_gru
  entrada: 256
  capa_dia: 256
  capas: 5
  unidades: 1024
  bidireccional: false
  kernel: 32
  stride: 4
  dropout_entrada: 0.2
  dropout_gru: 0.4
  salidas_intermedias:
