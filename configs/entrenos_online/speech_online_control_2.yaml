etiquetas:
  silencio: SIL
  max_fonemas: 500
  recursos: data/speech_2023/recursos_g2p
  salida: data/speech_2023/fonemas_original
  timeout_descarga: 30
  recursos_nltk:
  - archivo: corpora/cmudict.zip
    url: https://raw.githubusercontent.com/nltk/nltk_data/550b6625bcef1f2abff2ff770a5a0d272c9c6b2a/packages/corpora/cmudict.zip
    sha256: d07cca47fd72ad32ea9d8ad1219f85301eeaf4568f8b6b73747506a71fb5afd6
  - archivo: taggers/averaged_perceptron_tagger.zip
    url: https://raw.githubusercontent.com/nltk/nltk_data/550b6625bcef1f2abff2ff770a5a0d272c9c6b2a/packages/taggers/averaged_perceptron_tagger.zip
    sha256: e1f13cf2532daadfd6f3bc481a49859f0b8ea6432ccdcd83e6a49a5f19008de9
  - archivo: taggers/averaged_perceptron_tagger_eng.zip
    url: https://raw.githubusercontent.com/nltk/nltk_data/550b6625bcef1f2abff2ff770a5a0d272c9c6b2a/packages/taggers/averaged_perceptron_tagger_eng.zip
    sha256: 6025f530624335c67d6547d44757b357b4e79bae030a0383e9887a92c1718f0b
preprocesamiento:
  normalizacion_epsilon: 1.0e-08
  suavizado:
    modo: causal
    sigma: 2.0
    retardo_bins: 8
    umbral: 0.0
    longitud_impulso: 100
    truncate: 4.0
modelo:
  nombre: speech_gru
  entrada: 256
  capa_dia: 256
  capas: 2
  unidades: 512
  bidireccional: false
  kernel: 14
  stride: 4
  dropout_entrada: 0.2
  dropout_gru: 0.4
entrenamiento:
  pasos: 10001
  micro_batch_size: 16
  optimizador: adam_tensorflow
  betas:
  - 0.9
  - 0.999
  epsilon: 0.1
  learning_rate:
    inicio: 0.02
    final: 0.0
    decay_pasos: 10000
    potencia: 1.0
  clip_grad_norm: 10.0
  l2: 1.0e-05
  ruido:
    blanco_sd: 1.0
    offset_sd: 0.2
  imprimir_cada: 10
evaluacion:
  micro_batch_size: 16
  cada_pasos: 50
  max_lotes: null
ejecucion:
  dispositivo: cuda
  hilos_cpu: 2
salida:
  directorio: checkpoints/speech_online_control_2
wandb:
  proyecto: tiiac-2026
  entidad: null
  modo: online
  directorio: runs/tracking
protocolo:
  nombre: t12_bloques_v1
  metodo: ultimos_bloques_por_sesion
  fraccion_validacion: 0.2
  manifiesto: docs/datasets/speech_2023/particion_t12_v1.json
  sha256: d9043f30f4755dfef1bdfa33f454ea7025c638ae01cb8a49e182ac1aaf62ccdb
  seleccion_checkpoint: per
reanudacion:
  cada_pasos: 250
  max_pasos_sesion: null
referencia_online:
  paper: https://doi.org/10.1038/s41586-023-06377-x
  config_autores: https://github.com/fwillett/speechBCI/blob/522a9605ccf0818def80b6fd80007598e790408e/NeuralDecoder/neuralDecoder/configs/model/gru_stack_inputNet.yaml
  entrenamiento: ctc_frases_completas
  normalizacion: train_fija_por_sesion
  alcance: fonemas_ctc_voraz_sin_modelo_lenguaje
  comparacion: salidas_intermedias_y_controles_propios
