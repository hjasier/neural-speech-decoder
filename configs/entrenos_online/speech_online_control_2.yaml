# Perfil de investigación causal; duración de entrenamiento pendiente de medir en Colab.
# No es el perfil de auditoría de menos de 20 minutos.
# Base de los autores: 512 unidades, kernel 14, stride 4 y L2 1e-5.
# Dropout según su YAML: entrada 0.2 tras softsign, GRU 0.4.
# 10.001 actualizaciones: bucle inclusivo publicado; la última usa LR cero.
# Adaptación: partición fija T12 y estadísticas de train por sesión, sin rolling z-score.
experimento:
  nombre: speech_online_control_2
  seed: 0
datos:
  raiz: data/speech_2023/competitionData
  preparados: data/speech_2023/preparados_comparacion_v1
  batch_size: 64
  num_workers: 0
  pin_memory: false
  sesiones:
  - t12.2022.04.28
  - t12.2022.05.05
  - t12.2022.05.17
  - t12.2022.05.19
  - t12.2022.05.24
  - t12.2022.05.26
  - t12.2022.06.02
  - t12.2022.06.07
  - t12.2022.06.14
  - t12.2022.06.16
  - t12.2022.06.21
  - t12.2022.06.28
  - t12.2022.07.05
