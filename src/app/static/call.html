<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#203c56">
  <title>Voz T12 · Llamada</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/call.css">
  <script src="/vendor/livekit-client.umd.min.js" defer></script>
  <script src="/call.js" defer></script>
</head>
<body>
  <svg class="icons" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-phone" viewBox="0 0 24 24"><path d="M7 3H4a1 1 0 0 0-1 1c0 9.4 7.6 17 17 17a1 1 0 0 0 1-1v-3l-5-2-2 2a14 14 0 0 1-7-7l2-2-2-5Z"/></symbol>
    <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="13" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3M8 22h8"/></symbol>
    <symbol id="i-captions" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="3"/><path d="M10 9a3 3 0 1 0 0 6M19 9a3 3 0 1 0 0 6"/></symbol>
    <symbol id="i-volume" viewBox="0 0 24 24"><path d="m11 4-6 5H2v6h3l6 5ZM15 8a6 6 0 0 1 0 8M18 4a11 11 0 0 1 0 16"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="m14 5-7 7 7 7"/></symbol>
  </svg>
  <main class="call-screen" aria-label="Llamada con Voz T12">
    <nav><a href="/" target="_blank" rel="noopener" aria-label="Abrir visor"><svg><use href="#i-back"/></svg><span>Visor</span></a></nav>
    <section class="contact" aria-label="Contacto">
      <div class="avatar" aria-hidden="true">T12</div>
      <h1>Voz T12</h1>
      <p id="phase" role="status">Conectando…</p>
      <time id="timer" hidden>00:00</time>
    </section>
    <section class="call-content" aria-label="Subtítulos de la llamada">
      <canvas id="wave" width="640" height="64" aria-hidden="true"></canvas>
      <div class="captions" id="captions"><p id="transcript" aria-live="polite" aria-atomic="true"></p></div>
    </section>
    <div class="bottom-controls">
      <p class="error" id="error" role="alert" hidden></p>
      <button class="audio-unlock" id="audio-unlock" hidden>Activar sonido</button>
      <div class="call-controls" id="call-controls" hidden>
        <div><button class="circle" id="mute" aria-label="Silenciar micrófono" aria-pressed="false"><svg><use href="#i-mic"/></svg><span class="slash" aria-hidden="true"></span></button><span id="mute-label">Silenciar</span></div>
        <div><button class="circle selected" id="captions-toggle" aria-label="Ocultar subtítulos" aria-pressed="true"><svg><use href="#i-captions"/></svg></button><span>Subtítulos</span></div>
        <div><button class="circle" id="sound" aria-label="Silenciar sonido" aria-pressed="false"><svg><use href="#i-volume"/></svg><span class="slash" aria-hidden="true"></span></button><span id="sound-label">Sonido</span></div>
      </div>
      <div class="primary-control" id="start-control"><button class="circle dial" id="start" disabled aria-label="Iniciar llamada"><svg><use href="#i-phone"/></svg></button><span id="start-label">Llamar</span></div>
      <div class="primary-control" id="end-control" hidden><button class="circle hangup" id="hangup" aria-label="Colgar llamada"><svg><use href="#i-phone"/></svg></button><span>Colgar</span></div>
    </div>
  </main>
  <div id="remote-audio" hidden></div>
</body>
</html>
